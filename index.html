<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ByErim - FedEx Label Fixer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#4d148c;margin-bottom:4px;font-size:1.5rem}
.subtitle{color:#666;margin-bottom:20px;font-size:.9rem}
.drop-zone{width:100%;max-width:500px;border:3px dashed #4d148c;border-radius:12px;padding:40px 20px;text-align:center;background:#fff;cursor:pointer;transition:all .2s}
.drop-zone.hover{background:#f3e8ff;border-color:#ff6200}
.drop-zone p{color:#333;font-size:1.1rem;margin-bottom:8px}
.drop-zone small{color:#888}
input[type=file]{display:none}
.file-list{width:100%;max-width:500px;margin-top:16px}
.file-item{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.file-item .name{color:#333;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.file-item .remove{color:#e74c3c;cursor:pointer;font-weight:bold;padding:4px 8px;border:none;background:none;font-size:1.1rem}
.btn{display:inline-block;margin-top:16px;padding:12px 32px;background:#4d148c;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;transition:background .2s}
.btn:hover{background:#ff6200}
.btn:disabled{background:#ccc;cursor:not-allowed}
.progress-bar{width:100%;max-width:500px;height:6px;background:#e0e0e0;border-radius:3px;margin-top:12px;overflow:hidden;display:none}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#4d148c,#ff6200);width:0;transition:width .3s}
.status{margin-top:10px;color:#666;font-size:.9rem}
.tip{max-width:500px;margin-top:20px;padding:16px;background:#fff8e1;border-radius:8px;border:1px solid #ffe082;font-size:.85rem;color:#555}
.tip b{color:#4d148c}
</style>
</head>
<body>
<h1>ByErim &mdash; FedEx Label Fixer</h1>
<p class="subtitle">Fix FedEx labels for Zebra thermal printers (v3)</p>
<div class="drop-zone" id="dropZone">
<p>Drop FedEx label PDFs here</p>
<small>or click to browse</small>
</div>
<input type="file" id="fileInput" accept=".pdf" multiple>
<div class="file-list" id="fileList"></div>
<button class="btn" id="processBtn" disabled>Fix &amp; Download</button>
<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<p class="status" id="status"></p>
<div class="tip">
<b>Print tip:</b> In Chrome print settings, set paper size to <b>97 x 148 mm</b>, Scale to <b>100%</b>, and Margins to <b>None</b>.
</div>
<script>
var dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput'),fl=document.getElementById('fileList'),pb=document.getElementById('processBtn'),bar=document.getElementById('progressBar'),fill=document.getElementById('progressFill'),st=document.getElementById('status');
var files=[];
dz.onclick=function(){fi.click()};
dz.ondragover=function(e){e.preventDefault();dz.classList.add('hover')};
dz.ondragleave=function(){dz.classList.remove('hover')};
dz.ondrop=function(e){e.preventDefault();dz.classList.remove('hover');addFiles(e.dataTransfer.files)};
fi.onchange=function(e){addFiles(e.target.files)};
function addFiles(nf){for(var i=0;i<nf.length;i++){var f=nf[i];if(f.type==='application/pdf')files.push(f)}renderList()}
function renderList(){fl.innerHTML='';for(var i=0;i<files.length;i++){var d=document.createElement('div');d.className='file-item';d.innerHTML='<span class="name">'+files[i].name+'<\/span><button class="remove" onclick="removeFile('+i+')">&times;<\/button>';fl.appendChild(d)}pb.disabled=files.length===0}
function removeFile(i){files.splice(i,1);renderList()}
pb.onclick=async function(){
  pb.disabled=true;bar.style.display='block';fill.style.width='0%';st.textContent='Processing...';
  try{
    for(var i=0;i<files.length;i++){
      st.textContent='Processing '+(i+1)+' of '+files.length+': '+files[i].name;
      fill.style.width=((i/files.length)*100)+'%';
      var result=await fixPDF(files[i]);
      var blob=new Blob([result],{type:'application/pdf'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;
      a.download=files[i].name.replace('.pdf','')+'_fixed.pdf';
      a.click();URL.revokeObjectURL(url);
    }
    fill.style.width='100%';st.textContent='Done! '+files.length+' label(s) fixed.';
  }catch(err){st.textContent='Error: '+err.message;console.error(err)}
  pb.disabled=false;
};
async function fixPDF(file){
  var ab=await file.arrayBuffer();
  var srcDoc=await PDFLib.PDFDocument.load(ab);
  var newDoc=await PDFLib.PDFDocument.create();
  var pages=srcDoc.getPages();
  /* 97mm x 148mm in points (1mm = 2.83465pt) */
  var TW=97*2.83465,TH=148*2.83465;
  for(var i=0;i<pages.length;i++){
    var srcPage=pages[i];
    srcPage.setRotation(PDFLib.degrees(0));
    var embedded=(await newDoc.embedPages([srcPage]))[0];
    var newPage=newDoc.addPage([TW,TH]);
    newPage.drawPage(embedded,{x:0,y:0,width:TW,height:TH});
  }
  return await newDoc.save();
}
</script>
</body>
</html>
