<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ByErim - FedEx Label Rotator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}h1{font-size:24px;color:#333;margin-bottom:8px}.sub{color:#666;font-size:14px;margin-bottom:32px;text-align:center}.dz{width:100%;max-width:600px;border:2px dashed #ccc;border-radius:12px;padding:60px 40px;text-align:center;background:#fff;cursor:pointer;transition:all .2s}.dz:hover,.dz.over{border-color:#4d148c;background:#f9f5ff}.dz svg{width:48px;height:48px;margin-bottom:16px;color:#999}.dz p{color:#666;font-size:16px;margin-bottom:8px}.dz .h{color:#999;font-size:13px}input[type=file]{display:none}.fl{margin-top:24px;display:none;width:100%;max-width:600px}.fl.v{display:block}.fh{font-weight:600;font-size:15px;color:#333;margin-bottom:12px}.fi{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06)}.fn{font-weight:500;color:#333;font-size:14px}.fz{color:#888;font-size:12px;margin-left:8px}.fs{font-size:12px;color:#999}.fs.d{color:#2e7d32}.fs.e{color:#d32f2f}.fr{background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:0 4px;margin-left:12px}.fr:hover{color:#d32f2f}.br{margin-top:24px;display:none;gap:12px;flex-wrap:wrap;justify-content:center}.br.v{display:flex}.btn{padding:12px 32px;background:#4d148c;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}.btn:hover{background:#3a0f6a}.btn:disabled{background:#ccc;cursor:not-allowed}.btn.s{background:#666}.btn.s:hover{background:#555}.st{margin-top:16px;font-size:14px;color:#4d148c;display:none;text-align:center}.st.v{display:block}.st.e{color:#d32f2f}.pb{margin-top:16px;display:none;width:100%;max-width:600px;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}.pb.v{display:block}.pf{height:100%;background:#4d148c;border-radius:3px;transition:width .3s;width:0%}</style>
</head>
<body>
<h1>ByErim - FedEx Label Rotator</h1>
<p class="sub">Drop your FedEx label PDFs - physically rotated to portrait for Zebra printers</p>
<div class="dz" id="dz"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12l-3-3m0 0l-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg><p>Drop your FedEx label PDFs here</p><p class="h">or click to browse - select multiple</p></div>
<input type="file" id="fi" accept=".pdf" multiple>
<div class="fl" id="fl"><div class="fh" id="fh"></div><div id="fis"></div></div>
<div class="pb" id="pb"><div class="pf" id="pf"></div></div>
<div class="br" id="br"><button class="btn" id="rb">Rotate All and Download</button><button class="btn s" id="cb">Clear</button></div>
<div class="st" id="st"></div>
<canvas id="cv" style="display:none"></canvas>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const{PDFDocument:PD}=PDFLib;
const dz=document.getElementById("dz"),fi=document.getElementById("fi"),fl=document.getElementById("fl"),fh=document.getElementById("fh"),fis=document.getElementById("fis"),pb=document.getElementById("pb"),pf=document.getElementById("pf"),br=document.getElementById("br"),rb=document.getElementById("rb"),cb=document.getElementById("cb"),st=document.getElementById("st"),cv=document.getElementById("cv");
let F=[];
dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};
dz.ondragleave=()=>dz.classList.remove("over");
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");const d=[...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith(".pdf"));d.length&&af(d)};
fi.onchange=e=>{const s=[...e.target.files];s.length&&af(s);fi.value=""};
function af(n){F=F.concat(n);rl();fl.classList.add("v");br.classList.add("v");st.classList.remove("v");pb.classList.remove("v")}
function rl(){fh.textContent=F.length+" label"+(F.length!==1?"s":"")+" ready";fis.innerHTML="";F.forEach((f,i)=>{const d=document.createElement("div");d.className="fi";d.innerHTML='<div><span class="fn">'+f.name+'</span><span class="fz">'+sz(f.size)+'</span></div><div style="display:flex;align-items:center"><span class="fs" id="s'+i+'"></span><button class="fr" data-i="'+i+'">&times;</button></div>';fis.appendChild(d)});document.querySelectorAll(".fr").forEach(b=>b.onclick=e=>{F.splice(+e.target.dataset.i,1);if(!F.length){fl.classList.remove("v");br.classList.remove("v")}rl()})}
function sz(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB"}
cb.onclick=()=>{F=[];fl.classList.remove("v");br.classList.remove("v");st.classList.remove("v");pb.classList.remove("v");fis.innerHTML=""};
async function rotatePDF(file){
const ab=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
const newDoc=await PD.create();
for(let p=1;p<=pdf.numPages;p++){
const page=await pdf.getPage(p);
const scale=4;
const vp=page.getViewport({scale:scale,rotation:0});
cv.width=vp.width;cv.height=vp.height;
const ctx=cv.getContext("2d");
ctx.clearRect(0,0,cv.width,cv.height);
await page.render({canvasContext:ctx,viewport:vp}).promise;
ctx.translate(cv.width/2,cv.height/2);
ctx.rotate(Math.PI);
ctx.drawImage(cv,-cv.width/2,-cv.height/2);
const imgData=cv.toDataURL("image/png");
const imgBytes=Uint8Array.from(atob(imgData.split(",")[1]),c=>c.charCodeAt(0));
const img=await newDoc.embedPng(imgBytes);
const pg=newDoc.addPage([vp.width*72/96/scale*96/96,vp.height*72/96/scale*96/96]);
pg.drawImage(img,{x:0,y:0,width:pg.getWidth(),height:pg.getHeight()});
}
return await newDoc.save();
}
rb.onclick=async()=>{if(!F.length)return;rb.disabled=cb.disabled=true;let c=0,er=0;pb.classList.add("v");pf.style.width="0%";st.textContent="Rendering and rotating "+F.length+" label"+(F.length!==1?"s":"")+"...";st.classList.remove("e");st.classList.add("v");
for(let i=0;i<F.length;i++){const f=F[i],el=document.getElementById("s"+i);el&&(el.textContent="Rendering...");
try{const bytes=await rotatePDF(f);const blob=new Blob([bytes],{type:"application/pdf"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=f.name.replace(/\.pdf$/i,"_portrait.pdf");document.body.appendChild(a);a.click();a.remove();el&&(el.textContent="Done",el.className="fs d");c++}catch(x){console.error(x);el&&(el.textContent="Error",el.className="fs e");er++}
pf.style.width=(100*(i+1)/F.length)+"%";if(i<F.length-1)await new Promise(r=>setTimeout(r,300))}
st.textContent="Done! "+c+" label"+(c!==1?"s":"")+" rotated."+(er?" ("+er+" failed)":"");er&&st.classList.add("e");rb.disabled=cb.disabled=false};
</script>
</body>
</html>
